# lychee link-checker config — Designesy
# https://github.com/lycheeverse/lychee
#
# Fails CI on any broken external link (4xx/5xx) in the repo's public surface.
# Catches the class of bug that shipped 3 broken install links (Cursor deeplink,
# MCP Registry detail URL, Smithery badge) — all silently 404/500 until audited.

# ── Display ────────────────────────────────────────────────────────────────
# Don't show interactive progress bar (not available in CI).
no_progress = true

# ── Scoping ────────────────────────────────────────────────────────────────
# Only scan repo-level docs + config — never node_modules or install_tmp.
# These are regex patterns matched against file paths.
exclude_path = [
  "node_modules",
  "install_tmp",
  "\\.git",
  # package-lock.json contains transitive dep funding URLs (patreon,
  # opencollective, tidelift) that 403 bots — not our content to fix.
  "package-lock\\.json",
  # Recorded test fixtures. These are verbatim captures of a live page's HTML
  # and CSS, kept so packages/score/test/parity.test.mjs can compare the two
  # 42-check engine implementations OFFLINE (CI has no network). Every URL
  # inside them is TEST DATA, not a link we publish — checking them would gate
  # CI on whether x.com is up, and on the exact byte-shape of third-party markup
  # we merely recorded.
  #
  # This was found the moment the fixture was added (2026-09-25): it tripped
  # lychee with two 403s from x.com and several 308 redirect chains. Those are
  # the captured page's markup. "Fixing" them would mean editing a recording,
  # which corrupts the very input the parity test depends on.
  "test/fixtures/parity-page\\.json",
]

# ── Excludes (URLs that legitimately can't be HTTP-verified) ────────────────
# 1. cursor:// — native URI scheme (like vscode://), not an HTTP URL.
#    Browsers hand it to the Cursor app; lychee can't follow it.
# 2. vscode.dev/redirect/mcp/install — returns 302 to vscode: scheme handler.
#    Verified working manually, but lychee can't follow the native scheme.
# 3. insiders.vscode.dev/redirect — same pattern as #2.
# 4. Placeholder domains in code examples.
# 5. 127.0.0.1 — CDP localhost probe in designesy_mcp_server.py (not a real link).
exclude = [
  '^cursor://',
  '^https://vscode\.dev/redirect/mcp/install',
  '^https://insiders\.vscode\.dev/redirect/mcp/install',
  '^https://your-site\.com',
  '^https://your-app\.vercel\.app',
  '^http://127\.0\.0\.1',
  '^http://localhost',
  # nytimes.com — returns 403 to every automated client, including this
  # project's own scoring engine, which is why it is one of the three
  # leaderboard entries reported as unreachable. The link works for a human;
  # the 403 is bot detection, not a broken link.
  '^https://nytimes\.com',
  '^https://www\.nytimes\.com',
  # awwwards.com — consistently times out under lychee's bot user-agent
  # (Cloudflare bot protection). It's a reference link, not our content.
  '^https://awwwards\.com',
  # npmjs.com package pages — return 403 to lychee's bot user-agent.
  # Verified manually; these are our own published packages.
  '^https://www\.npmjs\.com/package/',
]

# ── Accept these status codes as OK ─────────────────────────────────────────
# 200 — OK
# 202 — Accepted (some sites return this for the root path, e.g. cssdesignawards.com)
# 301/302/307/308 — redirect (followed by lychee; the final status is what
#   matters). 307 and 308 were MISSING, which made this check fail on every run
#   from 2026-09-18 onward: getdesy.com returns 307 and radix-ui.com returns 308,
#   and both are correct, reachable sites. 308 is the modern permanent-redirect
#   status many hosts now return instead of 301. A checker that fails on working
#   links trains people to ignore it — the same "cries wolf" failure the
#   mirror-verify script had.
# 405 — Method Not Allowed (POST-only endpoints like /api/mcp reject GET)
accept = ["200", "202", "301", "302", "307", "308", "405"]

# ── Timeout ──────────────────────────────────────────────────────────────────
# 20s per request — some badge/shield endpoints are slow under load.
timeout = 20

# ── Retry ────────────────────────────────────────────────────────────────────
# 3 retries for flaky endpoints (Smithery, PyPI behind Cloudflare).
max_retries = 3

# ── Cache ────────────────────────────────────────────────────────────────────
# Cache results for 24h — speeds up re-runs within the same CI day.
cache = true

# ── User agent ───────────────────────────────────────────────────────────────
# Identify ourselves so rate-limiting doesn't trigger false 403s.
user_agent = "designesy-link-checker/1.0 (https://github.com/LE-VAI/designesy-org)"