name: "Designesy Contract Check"
description: >-
  Score a URL against the Designesy design-system contract (40 deterministic
  checks) and fail the workflow when the score or grade drops below your
  threshold. A design-contract quality gate for CI — token, motion,
  accessibility, cadence, takt, typography, and copywriting compliance as a PR
  check. Supports 4 emission formats via the 'format' input: designesy
  (default), canonical (review-findings.json schema), review (jakubkrehel
  markdown), google (design.md-compatible). Posts a summary comment on pull
  requests when post-comment is enabled. Optionally emits a SARIF v2.1.0 file
  for GitHub code-scanning integration (sarif-output input) and ratchets
  against a committed baseline to prevent regressions (baseline input).
author: "designesy"
branding:
  icon: "check-circle"
  color: "blue"
inputs:
  url:
    description: "The URL to score against the design contract."
    required: true
  min-score:
    description: "Minimum acceptable score (0–100). The step fails if the score is below this. 0 disables the score check."
    required: false
    default: "0"
  min-grade:
    description: "Minimum acceptable letter grade (A, B, C, D, F). The step fails if the grade is worse than this. Empty disables the grade check."
    required: false
    default: ""
  format:
    description: "Emission format for the result JSON. designesy (default, native shape), canonical (review-findings.json schema — see /specs/review-findings.json), review (jakubkrehel better-interface markdown), google (@google/design.md-compatible {findings, summary, designSystem})."
    required: false
    default: "designesy"
  scope:
    description: "Scoring scope. 'universal' (default) — scores any URL; absence of Designesy-specific features is SKIP. 'contract' — strict mode for Designesy-owned sites; absence of contract tokens is WARN/FAIL."
    required: false
    default: "universal"
  api:
    description: "Base URL of the scoring engine (the /api/score endpoint). Defaults to the public designesy.org engine."
    required: false
    default: "https://www.designesy.org"
  fail-on-error:
    description: "Fail the step when the scoring engine is unreachable or returns a non-OK response. Set false to warn instead."
    required: false
    default: "true"
  post-comment:
    description: "Post a summary comment on the pull request with the score, grade, and gate verdict. Only acts on pull_request events; no-op on push/schedule/dispatch."
    required: false
    default: "true"
  github-token:
    description: "GitHub token for posting PR comments. Defaults to the workflow GITHUB_TOKEN. Requires pull-requests: write permission."
    required: false
    default: "${{ github.token }}"
  sarif-output:
    description: "Path to write a SARIF v2.1.0 file containing design-contract findings. When set, the action writes a SARIF file that can be uploaded to GitHub code-scanning via github/codeql-action/upload-sarif@v4. Only emitted for the 'designesy' format (which carries per-check data). Empty disables SARIF output."
    required: false
    default: ""
  baseline:
    description: "Path to a committed baseline JSON file (e.g. .designesy-baseline.json with { score, grade, date }). The step fails when the current score regresses below the baseline score, and writes an updated baseline on improvement so the floor only ratchets up. Empty disables the ratchet."
    required: false
    default: ""
outputs:
  score:
    description: "Numeric design-contract score (0–100)."
  grade:
    description: "Letter grade (A, B, C, D, or F)."
  pass-count:
    description: "Number of checks that returned PASS."
  fail-count:
    description: "Number of checks that returned FAIL."
  result:
    description: "The full scoring result as a JSON string (format depends on the 'format' input)."
  sarif-file:
    description: "Absolute path to the written SARIF file (only set when sarif-output is provided)."
runs:
  using: "node24"
  main: "dist/index.js"
