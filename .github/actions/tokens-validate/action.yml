name: 'Designesy Tokens Validator'
description: 'Validate a DTCG 2025.10 design token file against 20 conformance checks. Zero dependencies, works offline.'
author: 'Designesy'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  file:
    description: 'Path to a local DTCG token file (JSON) to validate'
    required: false
  url:
    description: 'URL of a remote DTCG token file to validate'
    required: false
  min-score:
    description: 'Minimum score (0-100) to pass. Exit 1 if below. Default: 0 (no gate)'
    required: false
    default: '0'
  json:
    description: 'Output raw JSON result instead of formatted table'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate tokens
      shell: bash
      # Inputs reach the shell as environment variables, never as inline
      # expressions, so a value can't be read as script.
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_JSON: ${{ inputs.json }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
      run: |
        ARGS=()
        if [ -n "$INPUT_FILE" ]; then
          ARGS+=("$INPUT_FILE")
        elif [ -n "$INPUT_URL" ]; then
          ARGS+=("$INPUT_URL")
        else
          echo "::error::Either 'file' or 'url' input is required"
          exit 2
        fi

        if [ "$INPUT_JSON" = "true" ]; then
          ARGS+=(--json)
        fi

        if [ "$INPUT_MIN_SCORE" != "0" ]; then
          ARGS+=(--min-score "$INPUT_MIN_SCORE")
        fi

        npx --yes @designesy/tokens@0.3.0 "${ARGS[@]}"