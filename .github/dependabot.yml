# Dependabot — automated security updates for the designesy.org repo.
#
# Watches both ecosystems in this monorepo:
#   1. npm (apps/site — the Next.js app deployed on Vercel)
#   2. pip (packages/designesy-mcp — the Python MCP server published to PyPI)
#
# On the weekly schedule, Dependabot opens PRs for each outdated dependency.
# Each PR triggers the CI workflow (ci.yml), which runs the build gate — so
# a broken dependency update is caught before merge, not after.
#
# GitHub native security alerts (secret scanning, push protection) are
# enabled separately in Settings → Code security and are free for public repos.

version: 2

updates:
  # ── npm: the Next.js app ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # Cooldown (shipped July 2025) — delay PR creation until a version has
    # been published for N days. Most compromised packages are yanked within
    # days, so a 3-5 day cooldown quietly filters a class of supply-chain
    # attacks. Security updates always bypass cooldown.
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    groups:
      # Group minor/patch updates together to reduce PR noise.
      # Security updates always get their own PR regardless of grouping.
      next:
        patterns:
          - next
          - react
          - react-dom
          - eslint
          - eslint-config-next
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
          - mcp-handler
      vercel:
        patterns:
          - "@vercel/*"
      browser:
        patterns:
          - "@sparticuz/chromium"
          - playwright-core
    # Defer major version bumps for packages that require migration work.
    # These will still get minor/patch updates; only major bumps are suppressed.
    # When ready to migrate, remove the ignore block and Dependabot will open the PR.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── pip: the Python MCP server ───────────────────────────────────────────
  - package-ecosystem: pip
    directory: /packages/designesy-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    groups:
      mcp:
        patterns:
          - mcp
          - httpx
          - anyio

  # ── GitHub Actions: keep workflow actions up to date ──────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    # SHA-pinned actions still get bump PRs because every pin has a trailing
    # "# vN" tag comment that Dependabot recognizes. Cooldown adds a buffer
    # so a compromised action tag doesn't get auto-PR'd same-day.
    cooldown:
      default-days: 5