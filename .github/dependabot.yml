# Dependabot — automated security updates for the designesy.org repo.
#
# Watches the ecosystems in this monorepo:
#   1. npm (apps/site — the Next.js app deployed on Vercel)
#   2. npm (packages/stylelint-plugin-dtcg-tokens — published to npm)
#   3. npm (packages/score — published to npm)
#   4. pip (packages/designesy-mcp — the Python MCP server published to PyPI)
#   5. github-actions (workflow action pins)
#
# On the weekly schedule, Dependabot opens PRs for each outdated dependency.
# Each PR triggers the CI workflow (ci.yml), which runs the build gate — so
# a broken dependency update is caught before merge, not after.
#
# NOTE — this file governs SCHEDULED VERSION UPDATES only. Security alerts
# follow the GitHub dependency graph and fire for any manifest in the repo,
# covered here or not. That asymmetry is how six alerts accumulated in
# packages/stylelint-plugin-dtcg-tokens while nothing ever opened a PR for it,
# so treat adding a directory here as separate work from it being scanned.
# (This repo has no npm "workspaces" field — every directory installs
# independently with its own lockfile, so each needs its own entry AND its own
# "overrides" block for transitive pins.)

version: 2

updates:
  # ── npm: the Next.js app ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # Cooldown (shipped July 2025) — delay PR creation until a version has
    # been published for N days. Most compromised packages are yanked within
    # days, so a 3-5 day cooldown quietly filters a class of supply-chain
    # attacks. Security updates always bypass cooldown.
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    groups:
      # Group minor/patch updates together to reduce PR noise.
      # Security updates always get their own PR regardless of grouping.
      next:
        patterns:
          - next
          - react
          - react-dom
          - eslint
          - eslint-config-next
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
          - mcp-handler
      vercel:
        patterns:
          - "@vercel/*"
      browser:
        patterns:
          - "@sparticuz/chromium"
          - playwright-core
    # Defer major version bumps for packages that require migration work.
    # These will still get minor/patch updates; only major bumps are suppressed.
    # When ready to migrate, remove the ignore block and Dependabot will open the PR.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── npm: the DTCG tokens stylelint plugin ────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/stylelint-plugin-dtcg-tokens
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    # Same deferral as apps/site, same reasons. This package declares
    # "stylelint": ">=16.0.0" as a peer and builds against 16, so a 17 major is
    # a real migration, not a bump. TypeScript majors routinely need config work.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]

  # ── npm: the score package ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/score
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── pip: the Python MCP server ───────────────────────────────────────────
  - package-ecosystem: pip
    directory: /packages/designesy-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    groups:
      mcp:
        patterns:
          - mcp
          - httpx
          - anyio

  # ── GitHub Actions: keep workflow actions up to date ──────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    # SHA-pinned actions still get bump PRs because every pin has a trailing
    # "# vN" tag comment that Dependabot recognizes. Cooldown adds a buffer
    # so a compromised action tag doesn't get auto-PR'd same-day.
    cooldown:
      default-days: 5