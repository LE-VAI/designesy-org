# Dependabot — automated security updates for the designesy.org repo.
#
# Watches the ecosystems in this monorepo:
#   1. npm (apps/site — the Next.js app deployed on Vercel)
#   2. npm (packages/stylelint-plugin-dtcg-tokens — published to npm)
#   3. npm (packages/score — published to npm)
#   4. pip (packages/designesy-mcp — the Python MCP server published to PyPI)
#   5. github-actions (workflow action pins)
#
# On the weekly schedule, Dependabot opens PRs for each outdated dependency.
# Each PR triggers the CI workflow (ci.yml), which runs the build gate — so
# a broken dependency update is caught before merge, not after.
#
# NOTE — this file governs SCHEDULED VERSION UPDATES only. Security alerts
# follow the GitHub dependency graph and fire for any manifest in the repo,
# covered here or not. That asymmetry is how six alerts accumulated in
# packages/stylelint-plugin-dtcg-tokens while nothing ever opened a PR for it,
# so treat adding a directory here as separate work from it being scanned.
# (This repo has no npm "workspaces" field, so every directory installs
# independently. Two corrections to what this note used to claim, both verified
# 2026-09-22:
#
#   - "each needs its own ENTRY" is no longer true. The plural `directories` key
#     (GA since June 2024) covers several paths in one entry, provided no path
#     overlaps another entry's. The five remaining packages now share one.
#   - "with its own lockfile" was wrong. lab-builder, vai-icons and vai-motion
#     have NO lockfile — and also zero dependencies, so nothing is narrowed
#     today. But the rule still bites if that changes: without a lockfile,
#     Dependabot excludes indirect dependencies inferred from the manifest from
#     vulnerability checks, so alert coverage would be direct-deps-only. Add a
#     lockfile with the first dependency, not after.
#
# "overrides" for transitive pins remains per-directory and is unaffected.)

version: 2

updates:
  # ── npm: the Next.js app ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    # Cooldown (shipped July 2025) — delay PR creation until a version has
    # been published for N days. Most compromised packages are yanked within
    # days, so a 3-5 day cooldown quietly filters a class of supply-chain
    # attacks. Security updates always bypass cooldown.
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    groups:
      # Group minor/patch updates together to reduce PR noise.
      # Security updates always get their own PR regardless of grouping.
      next:
        patterns:
          - next
          - react
          - react-dom
          - eslint
          - eslint-config-next
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
          - mcp-handler
      vercel:
        patterns:
          - "@vercel/*"
      browser:
        patterns:
          - "@sparticuz/chromium"
          - playwright-core
    # Defer major version bumps for packages that require migration work.
    # These will still get minor/patch updates; only major bumps are suppressed.
    # When ready to migrate, remove the ignore block and Dependabot will open the PR.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── npm: the remaining published packages ────────────────────────────────
  #
  # Added 2026-09-22. Before this, five published (non-private) packages had NO
  # entry and so received no scheduled version updates at all.
  #
  # WHY NOT `directories: ["/packages/*"]`: the options reference warns that for
  # multiple blocks on the same ecosystem+branch "all values must be unique and
  # there is no overlap in directories defined." A wildcard would overlap the
  # three entries already above (score, stylelint-plugin-dtcg-tokens) and
  # /packages/designesy-mcp, which is a documented misconfiguration. The five
  # paths are therefore listed explicitly.
  #
  # WHY /packages/tokens IS INCLUDED DESPITE HAVING no runtime deps: it has
  # @types/node and typescript as devDependencies, and it has a lockfile, so
  # those are real, updatable dependencies. Same for cli.
  #
  # WHY THE OTHER THREE STILL GET AN ENTRY: lab-builder, vai-icons and vai-motion
  # declare zero dependencies today. An entry is not waste — it means the first
  # dependency any of them adds is covered automatically, rather than being
  # silently unmonitored until someone remembers this file exists. That is
  # exactly how the original three-entry gap happened.
  #
  # NOTE ON COVERAGE HONESTY: none of these five was ever unmonitored for
  # SECURITY. Dependabot alerts and security-update PRs follow the dependency
  # graph repo-wide and do not depend on this file. What was missing is
  # scheduled VERSION updates. The distinction matters — see the file header.
  - package-ecosystem: npm
    directories:
      - /packages/cli
      - /packages/tokens
      - /packages/lab-builder
      - /packages/vai-icons
      - /packages/vai-motion
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    # These are LIBRARIES, not apps: a version-range widening is usually correct
    # and a forced minimum bump can break consumers. The docs note Dependabot
    # widens ranges for what it detects as libraries; `increase-if-necessary`
    # keeps that behaviour explicit rather than inferred. HOW Dependabot decides
    # library-vs-app for npm is not documented, so this is set deliberately.
    versioning-strategy: increase-if-necessary

  # ── npm: the DTCG tokens stylelint plugin ────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/stylelint-plugin-dtcg-tokens
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    # Same deferral as apps/site, same reasons. This package declares
    # "stylelint": ">=16.0.0" as a peer and builds against 16, so a 17 major is
    # a real migration, not a bump. TypeScript majors routinely need config work.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]

  # ── npm: the score package ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/score
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── pip: the Python MCP server ───────────────────────────────────────────
  - package-ecosystem: pip
    directory: /packages/designesy-mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 60
    groups:
      mcp:
        patterns:
          - mcp
          - httpx
          - anyio

  # ── GitHub Actions: keep workflow actions up to date ──────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    # SHA-pinned actions still get bump PRs because every pin has a trailing
    # "# vN" tag comment that Dependabot recognizes. Cooldown adds a buffer
    # so a compromised action tag doesn't get auto-PR'd same-day.
    cooldown:
      default-days: 5