name: Bug report
description: Something does not work as documented, or a score or check verdict looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security issue, do not open an issue: follow the [security policy](https://github.com/LE-VAI/designesy-org/security/policy).
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did the problem happen?
      options:
        - www.designesy.org (site or API)
        - Remote MCP endpoint (/api/mcp)
        - designesy-mcp (PyPI)
        - "@designesy/score"
        - "@designesy/cli"
        - "@designesy/tokens"
        - "@designesy/stylelint-plugin-dtcg-tokens"
        - "@designesy/lab-builder"
        - GitHub Action (Designesy Contract Check)
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, the action ref, or the engine version shown in the result.
      placeholder: "@designesy/score x.y.z, or LE-VAI/designesy-org@v1"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the URL you scored, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command, request or MCP tool call, with its arguments.
      placeholder: |
        1. Run `npx @designesy/score example.com --json`
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Paste the relevant output. Remove tokens, keys and private URLs first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node or Python version, and MCP client if relevant.
      placeholder: "macOS 15, Node 22, Claude Code"
