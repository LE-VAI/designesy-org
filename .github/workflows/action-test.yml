# Self-test + CI design gate for the designesy.org repo itself.
# Runs the action against the live designesy.org site on every PR.
# Serves double duty: (1) exercises the action code on node24, (2) catches
# design-contract regressions (score must stay >= 90 / grade A).
name: design-contract-self-test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: LE-VAI/designesy-org/action@main
        with:
          url: https://www.designesy.org
          min-score: 90
          min-grade: A
          post-comment: true