name: Publish to npm

# Auto-publishes @designesy/* packages to npmjs.org on version tags, with
# cryptographically signed build provenance (npm --provenance).
#
# Provenance is signed with GitHub OIDC + Sigstore (keyless). Publishing
# itself still authenticates with the NPM_TOKEN secret until npm trusted
# publishing is configured for each package on npmjs.com; then the token is
# removed and npm (11.5.1 or later, installed below) uses OIDC instead.
# Consumers can verify the package was built from this exact source:
#   gh attestation verify @designesy/tokens@0.2.1 -o LE-VAI
#
# Supported tag patterns:
#   tokens-v*        → packages/tokens       → @designesy/tokens
#   stylelint-v*     → packages/stylelint-plugin-dtcg-tokens → @designesy/stylelint-plugin-dtcg-tokens
#   lab-builder-v*   → packages/lab-builder  → @designesy/lab-builder
#   cli-v*           → packages/cli          → @designesy/cli
#   score-v*         → packages/score        → @designesy/score
#
# Prerequisites:
#   - npm provenance requires a PUBLIC repo (this one is public ✓)
#   - Node >= 18, npm >= 9.5 (we use Node 22 ✓)
#   - The package must be public in package.json (not private)
#   - NPM_TOKEN secret (granular access token) until trusted publishing is set
#   - id-token: write enables the --provenance flag (OIDC → Sigstore keyless)

on:
  push:
    tags:
      - "tokens-v*"
      - "stylelint-v*"
      - "lab-builder-v*"
      - "cli-v*"
      - "score-v*"
  workflow_dispatch:         # allow manual re-publish from the Actions tab

permissions:
  contents: read
  id-token: write            # REQUIRED for npm provenance (OIDC + Sigstore)

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Publishes only from a version tag; a manual run must pick the tag as its ref.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm 11.5.1+ can publish through trusted publishing (OIDC) once each
      # package names this workflow on npmjs.com. Pinned, not "latest".
      - name: Install npm 11
        run: npm install -g npm@11.20.0

      - name: Determine package directory and name from tag
        id: pkg
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == tokens-v* ]]; then
            echo "dir=packages/tokens" >> "$GITHUB_OUTPUT"
            echo "name=@designesy/tokens" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#tokens-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == stylelint-v* ]]; then
            echo "dir=packages/stylelint-plugin-dtcg-tokens" >> "$GITHUB_OUTPUT"
            echo "name=@designesy/stylelint-plugin-dtcg-tokens" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#stylelint-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == lab-builder-v* ]]; then
            echo "dir=packages/lab-builder" >> "$GITHUB_OUTPUT"
            echo "name=@designesy/lab-builder" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#lab-builder-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == cli-v* ]]; then
            echo "dir=packages/cli" >> "$GITHUB_OUTPUT"
            echo "name=@designesy/cli" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#cli-v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == score-v* ]]; then
            echo "dir=packages/score" >> "$GITHUB_OUTPUT"
            echo "name=@designesy/score" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#score-v}" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown tag prefix: $TAG"
            exit 1
          fi

      # VERIFY, never sync: a tag must point at a commit whose package.json
      # already carries that version, as publish-pypi.yml requires for PyPI.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          FILE_VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag says $VERSION but $PKG_DIR/package.json says $FILE_VERSION. Bump the package in a commit, then tag that commit."
            exit 1
          fi
          echo "Tag and package.json agree: $VERSION"

      - name: Build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          cd "$PKG_DIR"
          npm ci
          npm run build

      - name: Run tests
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          cd "$PKG_DIR"
          npm test

      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd "$PKG_DIR"
          # --provenance signs the package with GitHub OIDC + Sigstore.
          # --access public ensures scoped packages are publicly readable.
          npm publish --provenance --access public
        env:
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm publication
        if: startsWith(github.ref, 'refs/tags/')
        # The registry can take a few minutes to serve a new version (npm took
        # about 3 on 2026-10-08). Poll for up to 10 minutes; a version that never
        # appears fails the run. This step used to print a note and pass on a
        # 404, so a failed publish read green.
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          for i in $(seq 1 30); do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves $NAME@$VERSION (check $i)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$NAME@$VERSION did not appear on npm within 10 minutes"
          exit 1
