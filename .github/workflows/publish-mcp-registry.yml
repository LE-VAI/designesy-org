name: Publish to MCP Registry

# Auto-republishes designesy-mcp to the official MCP registry
# (registry.modelcontextprotocol.io) on every version tag, via GitHub OIDC.
# No stored secrets — uses the workflow's own OIDC token.
#
# Namespace: io.github.LE-VAI/designesy-org (GitHub-authenticated, case-sensitive — must match org casing).
# Sister listing org.designesy.www/designesy is the DNS-authenticated branded
# namespace and is published manually when it needs a bump.

on:
  push:
    tags: ["v*"]            # triggers on version tags like v1.3.1
  workflow_dispatch:        # allow manual re-publish from the Actions tab

permissions:
  id-token: write           # REQUIRED for OIDC authentication
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # Keep server.json version in lockstep with the tag that fired this run.
      - name: Sync server.json version with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "Synced server.json version -> $VERSION"

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Confirm registration
        run: |
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.LE-VAI/designesy-org" | head -c 800
