name: Publish to MCP Registry

# Auto-republishes designesy-mcp to the official MCP registry
# (registry.modelcontextprotocol.io) on every version tag, via GitHub OIDC.
# No stored secrets — uses the workflow's own OIDC token.
#
# Namespace: io.github.LE-VAI/designesy-org (GitHub-authenticated, case-sensitive — must match org casing).
# Sister listing org.designesy.www/designesy is the DNS-authenticated branded
# namespace and is published manually when it needs a bump.

on:
  push:
    tags: ["v*"]            # triggers on version tags like v1.3.1
  workflow_dispatch:        # allow manual re-publish from the Actions tab

permissions:
  id-token: write           # REQUIRED for OIDC authentication
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # Keep server.json version AND packages[].version in lockstep with the tag.
      # The packages[].version must match the PyPI version so registry clients
      # install the correct package — a mismatch here leaves stale versions in
      # the registry (previous entries had pkg 1.8.3 while top-level was 1.8.4).
      - name: Sync server.json version with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "Synced server.json version + packages[].version -> $VERSION"
          cat server.json | jq '{version, packages: [.packages[].version]}'

      - name: Wait for PyPI package to appear (avoid publish race)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Waiting for PyPI designesy-mcp@$VERSION to appear..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/designesy-mcp/$VERSION/json")
            if [ "$STATUS" = "200" ]; then
              echo "PyPI designesy-mcp@$VERSION is live (HTTP 200) after ~$((i*5))s"
              exit 0
            fi
            echo "Attempt $i/24: HTTP $STATUS, waiting 5s..."
            sleep 5
          done
          echo "PyPI designesy-mcp@$VERSION did not appear within 120s — proceeding anyway (registry may reject if package is missing)"
          exit 0

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Confirm registration
        run: |
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.LE-VAI/designesy-org" | head -c 800
