# Link checker — fails CI on any broken external link.
#
# Prevents the class of bug that shipped 3 broken install links in the
# designesy-mcp README (Cursor deeplink 404, MCP Registry detail 404, Smithery
# badge 500) — all silently broken until a manual audit caught them.
#
# Uses lychee (https://github.com/lycheeverse/lychee) with config in
# .lychee.toml at the repo root. Scans every .md/.json/.yml/.yaml/.toml/.py
# file in the repo, plus the issue templates under .github/. exclude_path in
# .lychee.toml drops node_modules, install_tmp, test fixtures and vendored code.
#
# Editor install deeplinks (cursor://, vscode.dev/redirect) are excluded
# in .lychee.toml because they use native URI schemes that HTTP checkers
# cannot follow — they're verified manually in the link audit instead.

name: link-check

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.py"
      - ".lychee.toml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.py"
      - ".lychee.toml"
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC — catches link rot even with no PRs
  workflow_dispatch:       # manual trigger from the Actions tab

permissions:
  contents: read
  pull-requests: write     # for the PR comment summary

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.run_id }}
          restore-keys: lychee-cache-

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The globs are quoted so that lychee expands `**` itself, at every
          # depth. The action's entrypoint.sh runs `eval lychee ... ${ARGS}`
          # in bash without globstar, where an unquoted ./**/*.md means
          # ./*/*.md: on 2026-10-21 it matched 3 of the 59 Markdown files, and
          # README.md, CHANGELOG.md and the package READMEs were never checked.
          # lychee's glob skips hidden directories, so the issue templates are
          # listed on their own. The workflows stay out: the URLs they build
          # from variables ($VERSION, ${VERCEL_ORG_ID}) would be checked as
          # written. .lychee.toml exclude_path filters the rest.
          args: --config .lychee.toml --cache --verbose './**/*.md' './**/*.json' './**/*.yml' './**/*.yaml' './**/*.toml' './**/*.py' './.github/ISSUE_TEMPLATE/*.yml'
          fail: true
          format: markdown
          output: lychee/out.md
          jobSummary: true

      - name: Comment PR with link-check results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let summary = 'Link check failed. See the Actions log for details.';
            try {
              summary = fs.readFileSync('lychee/out.md', 'utf8');
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🔗 Link Check Results\n\n${summary}\n\n---\n_Automated by the [link-check workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/link-check.yml)._`,
            });