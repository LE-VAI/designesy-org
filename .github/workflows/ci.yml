# CI — the build gate Vercel was missing.
#
# Runs the EXACT command Vercel runs (`npm run build`) on every PR and every
# push to main, BEFORE the change reaches Vercel. This closes the root cause
# confirmed by Vercel's AI assistant: "source changes are reaching Vercel
# before the production build is validated locally or in CI."
#
# Failure classes this catches (all sampled from real failed Vercel deploys):
#   • Missing default export in opengraph-image.tsx (route contract error)
#   • TSX syntax errors (next build → type collection fails)
#   • ESLint react/no-unescaped-entities (build-blocking in core-web-vitals)
#   • scripts/postbuild-pagefind.js syntax errors
#   • Any TypeScript type error (tsc --noEmit)
#
# After this workflow is wired as a required status check on main (see
# branch protection setup), a broken build cannot merge and cannot reach
# Vercel's production deploy.
#
# Layered with Vercel's promotion gate (Settings → Git → Git Settings →
# "Block deployment promotion until GitHub Actions pass"), this gives two
# independent gates: merge gate (this workflow) + production gate (Vercel).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: Node / Next.js build gate ──────────────────────────────────────
  # Runs lint + typecheck + build in the apps/site workspace.
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          # setup-node resolves this path from the repo root, NOT from
          # working-directory. Must be explicit even though defaults.run
          # is set to apps/site above.
          cache-dependency-path: apps/site/package-lock.json

      # npm ci enforces the lockfile (fails if out of sync) and is faster
      # than npm install. Never use npm install in CI — it can mutate the
      # lockfile and break reproducibility.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # The build is split into NAMED STEPS rather than one `npm run build`.
      #
      # WHY: `npm run build` chains six commands, so any failure collapsed into a
      # single "Build site: fail" with the cause buried in a long log. Splitting
      # makes each gate its own named check in the GitHub UI, so a red run says
      # which gate failed without reading output.
      #
      # WHY STEPS AND NOT SEPARATE JOBS: the gates all need .next/server/app,
      # which only exists after `next build`. Five separate jobs would each pay
      # for checkout + npm ci + a full build, turning one 2-minute build into ten.
      # Steps share the workspace at no cost.
      #
      # `if: always()` ON THE GATES IS DELIBERATE. Without it, a failing first
      # gate cancels the rest and you learn one problem per run. This way a
      # single run reports every gate's verdict.
      #
      # The `npm run build` script still chains them for Vercel, which is where
      # the real deploy gate lives. This mirrors it, step for step.
      - name: Next build
        run: npx next build

      - name: Contract drift
        if: always()
        run: node scripts/check-contract-drift.js

      - name: Pagefind index
        if: always()
        run: node scripts/postbuild-pagefind.js

      - name: Generate markdown
        if: always()
        run: node scripts/generate-markdown.js

      - name: Prose gate
        if: always()
        run: node scripts/prose-lint.js

      - name: Contract version guard
        if: always()
        run: node scripts/check-contract-version.js

      # ── The gates below ran in `npm run build` but NOT here ────────────────
      #
      # This job's own comment promised it mirrors `npm run build` "step for
      # step". It did not: the script chains twelve gates, this job invoked five.
      # The other seven ran only when Vercel built for production — i.e. AFTER
      # merge, on main, with no PR-level signal. That included
      # check-use-client-first, the guard for the directive-ordering defect that
      # took every route down on 2026-09-24, and check-count-up-seed, whose
      # regression is invisible to tsc, lint, and the prerender alike.
      #
      # The practical effect: a PR could pass CI green and only fail at deploy.
      # Vercel building it is not a substitute — by then it is merged.
      #
      # Restored to parity 2026-09-25. If a gate is added to `npm run build`,
      # add it here in the same commit; the two lists are asserted equal by
      # scripts/check-gate-parity.js so they cannot silently diverge again.
      - name: Probe backticks
        if: always()
        run: node scripts/check-probe-backticks.js

      - name: Count-up seed
        if: always()
        run: node scripts/check-count-up-seed.js

      - name: d02 style-attribute coverage
        if: always()
        run: node scripts/check-d02-coverage.js

      - name: MCP tool parity
        if: always()
        run: node scripts/check-mcp-tool-parity.js

      - name: Count literal
        if: always()
        run: node scripts/check-count-literal.js

      - name: use-client directive first
        if: always()
        run: node scripts/check-use-client-first.js

      - name: Hero a11y name
        if: always()
        run: node scripts/check-hero-a11y-name.js

      - name: Extractor brace bound
        if: always()
        run: node scripts/check-extractor-brace-bound.js

      - name: Cross-engine agreement
        if: always()
        run: node scripts/check-cross-engine-agreement.js

      - name: Gate parity (build script vs CI)
        if: always()
        run: node scripts/check-gate-parity.js

      # Cache the Next.js build output for faster re-runs on the same PR.
      - name: Cache .next
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/site/.next
          key: nextjs-${{ github.sha }}
          restore-keys: nextjs-

  # ── Job 2: Python MCP package gate ───────────────────────────────────────
  # The designesy-mcp Python package lives in packages/designesy-mcp and
  # publishes to PyPI + MCP registry on tag. Verify it builds AND passes
  # its test suite in CI so a broken Python change can't merge.
  build-mcp:
    name: Build & test MCP package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/designesy-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Install package with test dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest test/ -v

  # ── Job 3: npm package test gate ─────────────────────────────────────────
  # Both @designesy/tokens and @designesy/stylelint-plugin-dtcg-tokens have
  # test suites that only ran at publish time. This job runs them on every PR
  # so a broken test can't merge. The pretest hook runs `npm run build`
  # automatically before `npm test`.
  test-packages:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package: [tokens, stylelint-plugin-dtcg-tokens]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: npm ci

      - name: Build & test
        working-directory: packages/${{ matrix.package }}
        run: npm test

  # The scoring engine's own suite, including the calibration corpus.
  #
  # This package was absent from the matrix above and its 37 tests never ran in
  # CI. That mattered more than usual: the corpus is the only thing asserting
  # engine VERDICTS (every other suite asserts shape), so without this job a
  # regression that inverted a check would reach production unchecked.
  #
  # The parity test calls the live API, so it is skipped here — CI must not
  # depend on designesy.org being up, and a network-dependent gate is one that
  # gets deleted the first time it flakes. The corpus runs fully offline.
  test-score-engine:
    name: Test score engine + calibration corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packages/score
        run: npm install --no-audit --no-fund

      - name: Build engine
        working-directory: packages/score
        run: npm run build

      - name: Run engine tests + calibration corpus
        working-directory: packages/score
        env:
          SKIP_LIVE_TESTS: '1'
        run: npm test

      - name: Verify the published corpus artifact is current
        working-directory: packages/score
        # Fails when the fixtures changed but corpus.json did not, so the
        # published artifact cannot drift from the tests it describes.
        run: node scripts/export-corpus.mjs --check
  # ── Job 6: Post-merge domain freshness ─────────────────────────────────────
  # Verifies that the PRODUCTION DOMAIN is serving the commit that was just
  # merged — not merely that a deployment exists.
  #
  # WHY THIS LIVES HERE AND NOT ONLY IN post-deploy-smoke.yml
  # post-deploy-smoke.yml already has an `alias-verify` job for this, and it is
  # the right place conceptually. But its trigger is `deployment_status`, and
  # that event has fired ZERO runs for this repository. Measured 2026-09-25:
  # every one of the 9 smoke runs in history was `workflow_dispatch` (manual);
  # the only `deployment_status`-event run ever recorded was an unrelated
  # `startup_failure` on a leaderboard branch on 2026-08-31.
  #
  # Meanwhile the alias trap — a `Ready` deployment whose build the domain never
  # serves — fired on EVERY deploy on 2026-09-25. So the check existed, in a
  # workflow that never ran, and the failure it was written for happened four
  # times in one session with nothing detecting it.
  #
  # This job runs on `push: branches: [main]`, which is the trigger that
  # demonstrably works in this repo. It duplicates the smoke job's assertion on
  # purpose: a gate that never fires is not coverage, and "the other workflow
  # should have caught it" is how this went unnoticed.
  #
  # It runs only on push (not on pull_request), because before merge there is
  # nothing to verify — the domain serves the previous commit by definition.
  domain-freshness:
    name: Domain freshness (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    needs: [build-site]

    steps:
      - name: Wait for the deployment to land, then verify the domain's commit
        run: |
          set -e
          EXPECTED="${{ github.sha }}"
          DOMAIN="https://www.designesy.org"

          echo "## Post-merge domain freshness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Expected commit: \`$EXPECTED\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Vercel builds on push and usually finishes in ~90-120s. Poll rather
          # than sleep once, so a fast build is not punished and a slow one is
          # still caught. 20 attempts x 30s = 10 minutes, which matches the job
          # timeout — if the build genuinely never lands, that IS the finding.
          DOMAIN_SHA=""
          for i in $(seq 1 20); do
            BODY=$(curl -s --max-time 20 "${DOMAIN}/api/version" 2>/dev/null || echo '')
            DOMAIN_SHA=$(printf '%s' "$BODY" | grep -oE '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' || true)
            if [ "$DOMAIN_SHA" = "$EXPECTED" ]; then
              echo "Attempt $i: domain serves the expected commit." >> $GITHUB_STEP_SUMMARY
              break
            fi
            echo "Attempt $i/$(( 20 )): domain reports \`${DOMAIN_SHA:-<none>}\` — waiting 30s" 
            sleep 30
          done

          if [ -z "$DOMAIN_SHA" ]; then
            {
              echo "✗ **Could not measure domain freshness.**"
              echo ""
              echo "\`${DOMAIN}/api/version\` never reported a commit. This is a"
              echo "FAILURE, not a skip: a freshness gate that passes when it cannot"
              echo "see is the defect this job exists to remove."
              echo ""
              echo "Most likely cause: *Enable access to System Environment Variables*"
              echo "is off in Vercel project settings, so \`VERCEL_GIT_COMMIT_SHA\` is"
              echo "never injected. (It was ON as of 2026-09-25 — verified live.)"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "$DOMAIN_SHA" = "$EXPECTED" ]; then
            echo "✅ Domain is serving the merged commit: \`${DOMAIN_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "✅ Domain freshness verified: ${DOMAIN_SHA}"
            exit 0
          fi

          {
            echo "✗ **STALE DOMAIN — production is not serving the merged commit.**"
            echo ""
            echo "| | commit |"
            echo "|---|---|"
            echo "| merged (expected) | \`${EXPECTED}\` |"
            echo "| \`${DOMAIN}\` is serving | \`${DOMAIN_SHA}\` |"
            echo ""
            echo "**Fix:**"
            echo ""
            echo '```bash'
            echo "npx vercel promote \$(npx vercel ls --prod | awk 'NR==6{print \$3}') --yes"
            echo '```'
            echo ""
            echo "Then re-run this job. The deployment is Ready; only the production"
            echo "alias has not moved. Prefer \`promote\` over \`alias\` — promote keeps"
            echo "rollback bookkeeping coherent."
          } >> $GITHUB_STEP_SUMMARY
          echo "✗ Domain freshness: STALE — expected ${EXPECTED}, domain serves ${DOMAIN_SHA}"
          exit 1
