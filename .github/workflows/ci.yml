# CI — the build gate Vercel was missing.
#
# Runs the EXACT command Vercel runs (`npm run build`) on every PR and every
# push to main, BEFORE the change reaches Vercel. This closes the root cause
# confirmed by Vercel's AI assistant: "source changes are reaching Vercel
# before the production build is validated locally or in CI."
#
# Failure classes this catches (all sampled from real failed Vercel deploys):
#   • Missing default export in opengraph-image.tsx (route contract error)
#   • TSX syntax errors (next build → type collection fails)
#   • ESLint react/no-unescaped-entities (build-blocking in core-web-vitals)
#   • scripts/postbuild-pagefind.js syntax errors
#   • Any TypeScript type error (tsc --noEmit)
#
# After this workflow is wired as a required status check on main (see
# branch protection setup), a broken build cannot merge and cannot reach
# Vercel's production deploy.
#
# Layered with Vercel's promotion gate (Settings → Git → Git Settings →
# "Block deployment promotion until GitHub Actions pass"), this gives two
# independent gates: merge gate (this workflow) + production gate (Vercel).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Started by rescore-leaderboard.yml on its PR branch: CI on a PR opened by
  # github-actions[bot] waits for a human approval (GitHub, 2026-06-11), but a
  # dispatch always runs, and its checks land on the same head commit.
  workflow_dispatch:

# Cancel superseded runs on the same ref — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: Node / Next.js build gate ──────────────────────────────────────
  # Runs lint + typecheck + build in the apps/site workspace.
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          # setup-node resolves this path from the repo root, NOT from
          # working-directory. Must be explicit even though defaults.run
          # is set to apps/site above.
          cache-dependency-path: apps/site/package-lock.json

      # npm ci enforces the lockfile (fails if out of sync) and is faster
      # than npm install. Never use npm install in CI — it can mutate the
      # lockfile and break reproducibility.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # The build is split into NAMED STEPS rather than one `npm run build`.
      #
      # WHY: `npm run build` chains six commands, so any failure collapsed into a
      # single "Build site: fail" with the cause buried in a long log. Splitting
      # makes each gate its own named check in the GitHub UI, so a red run says
      # which gate failed without reading output.
      #
      # WHY STEPS AND NOT SEPARATE JOBS: the gates all need .next/server/app,
      # which only exists after `next build`. Five separate jobs would each pay
      # for checkout + npm ci + a full build, turning one 2-minute build into ten.
      # Steps share the workspace at no cost.
      #
      # `if: always()` ON THE GATES IS DELIBERATE. Without it, a failing first
      # gate cancels the rest and you learn one problem per run. This way a
      # single run reports every gate's verdict.
      #
      # The `npm run build` script still chains them for Vercel, which is where
      # the real deploy gate lives. This mirrors it, step for step.
      - name: Next build
        run: npx next build

      - name: Contract drift
        if: always()
        run: node scripts/check-contract-drift.js

      - name: Catalog version binding
        if: always()
        run: node scripts/check-catalog-version-binding.js

      - name: Pagefind index
        if: always()
        run: node scripts/postbuild-pagefind.js

      - name: Search coverage
        if: always()
        run: node scripts/check-search-coverage.js

      - name: Score verdict
        if: always()
        run: node scripts/check-score-verdict.mjs

      - name: Generate markdown
        if: always()
        run: node scripts/generate-markdown.js

      - name: Prose gate
        if: always()
        run: node scripts/prose-lint.js

      - name: Contract version guard
        if: always()
        run: node scripts/check-contract-version.js

      # README and PyPI README facts (check count, category count, contract
      # version) read from the engine source, so a bump cannot leave them stale.
      - name: README facts guard
        if: always()
        run: node scripts/check-readme-facts.js

      # ── The gates below ran in `npm run build` but NOT here ────────────────
      #
      # This job's own comment promised it mirrors `npm run build` "step for
      # step". It did not: the script chains twelve gates, this job invoked five.
      # The other seven ran only when Vercel built for production — i.e. AFTER
      # merge, on main, with no PR-level signal. That included
      # check-use-client-first, the guard for the directive-ordering defect that
      # took every route down on 2026-09-24, and check-count-up-seed, whose
      # regression is invisible to tsc, lint, and the prerender alike.
      #
      # The practical effect: a PR could pass CI green and only fail at deploy.
      # Vercel building it is not a substitute — by then it is merged.
      #
      # Restored to parity 2026-09-25. If a gate is added to `npm run build`,
      # add it here in the same commit; the two lists are asserted equal by
      # scripts/check-gate-parity.js so they cannot silently diverge again.
      - name: Probe backticks
        if: always()
        run: node scripts/check-probe-backticks.js

      - name: Count-up seed
        if: always()
        run: node scripts/check-count-up-seed.js

      - name: d02 style-attribute coverage
        if: always()
        run: node scripts/check-d02-coverage.js

      - name: MCP tool parity
        if: always()
        run: node scripts/check-mcp-tool-parity.js

      - name: Count literal
        if: always()
        run: node scripts/check-count-literal.js

      - name: use-client directive first
        if: always()
        run: node scripts/check-use-client-first.js

      - name: Hero a11y name
        if: always()
        run: node scripts/check-hero-a11y-name.js

      - name: Extractor brace bound
        if: always()
        run: node scripts/check-extractor-brace-bound.js

      - name: Cross-engine agreement
        if: always()
        run: node scripts/check-cross-engine-agreement.js

      - name: Engine registry
        if: always()
        run: node scripts/check-engine-registry.js

      - name: Data surfaces
        if: always()
        run: node scripts/check-data-surfaces.js

      # No page may gain em dashes or rhetorical negation pivots beyond
      # scripts/voice-baseline.json (the rules are in AGENTS.md, Public Copy).
      - name: Voice ratchet
        if: always()
        run: node scripts/check-voice.js

      # No sentence may wrap so that JSX glues two words ("the42-check").
      - name: JSX glue
        if: always()
        run: node scripts/check-jsx-glue.js

      # Text in a status or grade hue uses its --<hue>-ink token: several bare
      # light-theme hues are under 4.5:1 for text (--warn 3.51:1, --grade-b
      # 2.99:1 on --paper). Every ink token is measured on all four surfaces.
      - name: Status and grade ink contrast
        if: always()
        run: node scripts/check-warn-ink.js

      # Every focus style resolves outside its component's scope: the
      # findings filter lost its ring because --ctl-focus lived only on the bar.
      - name: Focus rings
        if: always()
        run: node scripts/check-focus-rings.js

      # Every entrance that starts at opacity 0 declares how it behaves when a
      # visitor pauses motion; a held first frame once emptied whole pages.
      - name: Paused entrances
        if: always()
        run: node scripts/check-paused-entrances.js

      - name: Gate parity (build script vs CI)
        if: always()
        run: node scripts/check-gate-parity.js

      # The three "Visual gates" parts serve THIS build rather than each
      # building again. It is uploaded before the cache step below, so it is
      # exactly what this job's `next build` and gates produced from this
      # commit, never a restored .next; and a run artifact belongs to this run
      # alone, so it cannot be another commit's build (the stale-cache failure
      # described below). The upload runs only when every build gate passed,
      # which is also when the visual gates run.
      #
      # .next/cache (the compiler cache) is not needed to serve and is left
      # out. The per-page markdown that generate-markdown.js writes into
      # public/ is served by the site, so it travels with the build.
      - name: Upload the build for the visual gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-build
          path: |
            apps/site/.next
            !apps/site/.next/cache
            apps/site/public/**/*.md
            apps/site/public/.md-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          # Long enough to re-run a failed part on a PR without rebuilding.
          retention-days: 3
          # A re-run of this job replaces the build instead of failing on the
          # name the first attempt already used.
          overwrite: true

      # Cache the Next.js build output for faster re-runs on the same PR.
      #
      # Exact-SHA key only, no prefix fallback: a prefix restore made the build
      # incremental on top of an older commit's .next, and the runtime-gates
      # job measured the stale output (the same failure twice). The build this
      # job saves must be exactly this commit's source, or every consumer of
      # the cache measures the wrong thing.
      - name: Cache .next
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/site/.next
          key: nextjs-${{ github.sha }}

  # ── Job 2: Python MCP package gate ───────────────────────────────────────
  # The designesy-mcp Python package lives in packages/designesy-mcp and
  # publishes to PyPI + MCP registry on tag. Verify it builds AND passes
  # its test suite in CI so a broken Python change can't merge.
  build-mcp:
    name: Build & test MCP package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/designesy-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Install package with test dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest test/ -v

  # ── Job 3: npm package test gate ─────────────────────────────────────────
  # Both @designesy/tokens and @designesy/stylelint-plugin-dtcg-tokens have
  # test suites that only ran at publish time. This job runs them on every PR
  # so a broken test can't merge. The pretest hook runs `npm run build`
  # automatically before `npm test`.
  test-packages:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package: [tokens, stylelint-plugin-dtcg-tokens]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: npm ci

      - name: Build & test
        working-directory: packages/${{ matrix.package }}
        run: npm test

  # The scoring engine's own suite, including the calibration corpus.
  #
  # This package was absent from the matrix above and its 37 tests never ran in
  # CI. That mattered more than usual: the corpus is the only thing asserting
  # engine VERDICTS (every other suite asserts shape), so without this job a
  # regression that inverted a check would reach production unchecked.
  #
  # The parity test calls the live API, so it is skipped here — CI must not
  # depend on designesy.org being up, and a network-dependent gate is one that
  # gets deleted the first time it flakes. The corpus runs fully offline.
  test-score-engine:
    name: Test score engine + calibration corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: packages/score
        run: npm install --no-audit --no-fund

      - name: Build engine
        working-directory: packages/score
        run: npm run build

      - name: Run engine tests + calibration corpus
        working-directory: packages/score
        env:
          # Kept deliberately. This was originally set to make CI skip
          # test/parity.test.mjs, whose old version called the live API — so the
          # only detector for divergence between the two 44-check implementations
          # never ran here.
          #
          # That test is now OFFLINE and runs regardless of this variable, so the
          # var no longer skips anything. It stays because removing it would make
          # any future test that reads it behave differently in CI than locally
          # for no stated reason. A new test that honours SKIP_LIVE_TESTS is
          # opting into being skipped here — say why in that test.
          SKIP_LIVE_TESTS: '1'
        run: npm test

      - name: Verify the published corpus artifact is current
        working-directory: packages/score
        # Fails when the fixtures changed but corpus.json did not, so the
        # published artifact cannot drift from the tests it describes.
        run: node scripts/export-corpus.mjs --check

      - name: Verify the Python offline engine's golden is current
        working-directory: packages/score
        # The PyPI MCP server falls back to a Python port of this engine. Its
        # parity test (build-mcp job) compares the port against this golden,
        # check by check. This step fails when the engine, its version, the
        # corpus or the parity page changed and the golden did not; the
        # regenerated golden then fails the Python test until the port follows.
        run: node scripts/export-offline-golden.mjs --check
  # ── Job 6: Post-merge domain freshness ─────────────────────────────────────
  # Verifies that the PRODUCTION DOMAIN is serving the commit that was just
  # merged — not merely that a deployment exists.
  #
  # WHY THIS LIVES HERE AND NOT ONLY IN post-deploy-smoke.yml
  # post-deploy-smoke.yml already has an `alias-verify` job for this, and it is
  # the right place conceptually. But its trigger is `deployment_status`, and
  # that event has fired ZERO runs for this repository. Measured 2026-09-25:
  # every one of the 9 smoke runs in history was `workflow_dispatch` (manual);
  # the only `deployment_status`-event run ever recorded was an unrelated
  # `startup_failure` on a leaderboard branch on 2026-08-31.
  #
  # Meanwhile the alias trap — a `Ready` deployment whose build the domain never
  # serves — fired on EVERY deploy on 2026-09-25. So the check existed, in a
  # workflow that never ran, and the failure it was written for happened four
  # times in one session with nothing detecting it.
  #
  # This job runs on `push: branches: [main]`, which is the trigger that
  # demonstrably works in this repo. It duplicates the smoke job's assertion on
  # purpose: a gate that never fires is not coverage, and "the other workflow
  # should have caught it" is how this went unnoticed.
  #
  # It runs only on push (not on pull_request), because before merge there is
  # nothing to verify — the domain serves the previous commit by definition.
  domain-freshness:
    name: Domain freshness (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    needs: [build-site]

    steps:
      - name: Wait for the deployment to land, then verify the domain's commit
        run: |
          set -e
          EXPECTED="${{ github.sha }}"
          DOMAIN="https://www.designesy.org"

          echo "## Post-merge domain freshness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Expected commit: \`$EXPECTED\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Vercel builds on push and usually finishes in ~90-120s. Poll rather
          # than sleep once, so a fast build is not punished and a slow one is
          # still caught. 20 attempts x 30s = 10 minutes, which matches the job
          # timeout — if the build genuinely never lands, that IS the finding.
          DOMAIN_SHA=""
          for i in $(seq 1 20); do
            BODY=$(curl -s --max-time 20 "${DOMAIN}/api/version" 2>/dev/null || echo '')
            DOMAIN_SHA=$(printf '%s' "$BODY" | grep -oE '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' || true)
            if [ "$DOMAIN_SHA" = "$EXPECTED" ]; then
              echo "Attempt $i: domain serves the expected commit." >> $GITHUB_STEP_SUMMARY
              break
            fi
            echo "Attempt $i/$(( 20 )): domain reports \`${DOMAIN_SHA:-<none>}\` — waiting 30s" 
            sleep 30
          done

          if [ -z "$DOMAIN_SHA" ]; then
            {
              echo "✗ **Could not measure domain freshness.**"
              echo ""
              echo "\`${DOMAIN}/api/version\` never reported a commit. This is a"
              echo "FAILURE, not a skip: a freshness gate that passes when it cannot"
              echo "see is the defect this job exists to remove."
              echo ""
              echo "Most likely cause: *Enable access to System Environment Variables*"
              echo "is off in Vercel project settings, so \`VERCEL_GIT_COMMIT_SHA\` is"
              echo "never injected. (It was ON as of 2026-09-25 — verified live.)"
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "$DOMAIN_SHA" = "$EXPECTED" ]; then
            echo "✅ Domain is serving the merged commit: \`${DOMAIN_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "✅ Domain freshness verified: ${DOMAIN_SHA}"
            exit 0
          fi

          {
            echo "✗ **STALE DOMAIN — production is not serving the merged commit.**"
            echo ""
            echo "| | commit |"
            echo "|---|---|"
            echo "| merged (expected) | \`${EXPECTED}\` |"
            echo "| \`${DOMAIN}\` is serving | \`${DOMAIN_SHA}\` |"
            echo ""
            echo "**Fix:**"
            echo ""
            echo '```bash'
            echo "npx vercel promote \$(npx vercel ls --prod | awk 'NR==6{print \$3}') --yes"
            echo '```'
            echo ""
            echo "Then re-run this job. The deployment is Ready; only the production"
            echo "alias has not moved. Prefer \`promote\` over \`alias\` — promote keeps"
            echo "rollback bookkeeping coherent."
          } >> $GITHUB_STEP_SUMMARY
          echo "✗ Domain freshness: STALE — expected ${EXPECTED}, domain serves ${DOMAIN_SHA}"
          exit 1

  # ── Job 5: Runtime visual gates, in three parallel parts ─────────────────
  # The alignment, glass, focus, motion, LCP, keyboard, status, dock and
  # incremental a11y gates. Each needs a browser and a running site, so none
  # of them can live in the build chain — that is exactly why the 280 edge
  # violations and the dead capsule blur both survived the build gate. Each
  # part serves the build CI just made and measures it. The a11y sweep runs on
  # the routes the commit touches (touched-routes.js maps the diff; shared
  # surfaces mean the full set).
  #
  # WHY THREE PARTS: as one job the gates ran one after another, and on
  # 2026-10-10 that job grew from about 8 minutes to 17-25 as the focus, dock,
  # status and LCP gates arrived; on a pull request it hit its 25-minute limit
  # inside Dock clearance. The parts run side by side, balanced by the step
  # times of a green run on main (38086271824):
  #   part 1  edges 79 s, glass 48, motion 120, LCP 48, keyboard 22, status 17
  #   part 2  focus visibility 187, a11y sweep 101 (the full set)
  #   part 3  dock clearance 443 (304-443 across that day's green runs)
  # Dock clearance is the longest single gate, so it runs alone and sets the
  # wall time. Every part must pass. A new runtime gate goes in the part with
  # the most room; scripts/check-gate-parity.js fails if a CI-only gate is no
  # longer invoked anywhere in this file.
  #
  # Within a part the steps keep their order and stop at the first failing
  # gate, as the single job did. The parts are independent, so a failure in
  # one no longer hides the verdicts of the others.
  #
  # WHY ONE SHARED BUILD: the single job built the site a second time after
  # build-site had built it. Each part now downloads build-site's build (the
  # site-build artifact: .next without its compiler cache, plus the generated
  # markdown), so a run builds the site once. It is still exactly this
  # commit's build: the artifact belongs to this run, unlike the .next cache,
  # whose prefix fallback once fed this job a stale build under an exact-SHA
  # key. Each part prints the BUILD_ID it serves, so the logs show all three
  # measured the same build.
  #
  # WHY AGAINST A LOCAL BUILD AND NOT THE VERCEL PREVIEW: preview deployments sit
  # behind deployment protection, so a CI runner without a bypass token gets a
  # 302 and measures a login page. Testing the build this run produced is also
  # the stronger assertion — it gates the commit, not a deployment of it.
  #
  # No part installs a browser. Edge contract, glass blur, motion pause, LCP
  # entrance, status messages, focus visibility and dock clearance pass
  # `--channel chrome` and launch the Chrome that GitHub's ubuntu runners ship.
  # Keyboard QA and the a11y sweep launch @sparticuz/chromium, a Linux Chromium
  # binary that is already a dependency; each of those two scripts finds it
  # itself.
  visual-gates-1:
    name: 'Visual gates (part 1: edges, glass, motion, LCP, keyboard, status)'
    runs-on: ubuntu-latest
    # About 6 minutes. 20, because Edge contract alone may spend two bounded
    # 240 s attempts.
    timeout-minutes: 20
    needs: build-site
    if: always() && needs.build-site.result == 'success'
    defaults:
      run:
        working-directory: apps/site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          # setup-node resolves this path from the repo root, NOT from
          # working-directory (same as the build-site job).
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: apps/site

      - name: Serve the build
        run: |
          echo "serving build $(cat .next/BUILD_ID)"
          npx next start -p 3422 > /tmp/next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3422/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up; log:"
          cat /tmp/next.log
          exit 1

      # Normally ~80 s. On 2026-10-08 it hung with no output until the job's
      # 20-minute timeout, cancelling every gate after it, while the identical
      # tree had passed minutes earlier. Each attempt is bounded at 240 s and a
      # timeout gets one retry; a real failure is never retried, and a hang
      # that repeats still fails. The step shell runs `bash -e`, so the exit
      # code is captured with `|| rc=$?` rather than read after the pipeline.
      #
      # Every recorded hang (2026-10-08 to 2026-10-10) ran on @sparticuz/chromium;
      # the gate now launches Chrome with `--channel chrome`, like the gates
      # after it. It also writes a timestamped stderr line before and after
      # each browser operation, so the last line of a killed attempt names the
      # route, width and step it hung on. Only the JSON goes to stdout and tee.
      - name: Edge contract
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            rc=0
            timeout --kill-after=10s 240s node scripts/edge-contract.js --base http://127.0.0.1:3422 --channel chrome --json | tee /tmp/edge.json || rc=$?
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ]; then exit "$rc"; fi
            echo "::warning::Edge contract attempt $attempt timed out after 240 s"
          done
          echo "::error::Edge contract timed out on both attempts"
          exit 1

      - name: Glass blur
        # playwright-core does not download browsers, so this must use a system
        # one. GitHub's ubuntu runners ship Google Chrome, and `chrome` is also
        # what a local Windows run uses, so the channel stays explicit and the
        # same everywhere.
        run: node scripts/check-glass-blur.js --base http://127.0.0.1:3422 --channel chrome

      # Pausing animations (WCAG 2.2.2) must never hide content: a paused
      # visitor once got empty surface pages (.fade-up held on its first frame).
      - name: Motion pause
        run: node scripts/check-motion-pause.js --base http://127.0.0.1:3422 --channel chrome

      # The largest content must not fade in from opacity 0: LCP is recorded
      # only once it paints visibly, so the surface-page header (.fade-up) held
      # LCP 0.6 s behind first paint until its entrance became a rise.
      - name: LCP entrance
        run: node scripts/check-lcp-entrance.js --base http://127.0.0.1:3422 --channel chrome

      - name: Keyboard QA
        run: node scripts/qa-keyboard.js --base http://127.0.0.1:3422

      # A failed score run must be announced (WCAG 4.1.3): each score surface
      # is failed on purpose, and the accessibility tree must carry the message
      # in one live region that was there before it (or an alert).
      - name: Status messages
        run: node scripts/check-status-messages.js --base http://127.0.0.1:3422 --channel chrome

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Visual gates"
            echo ""
            if [ -f /tmp/edge.json ]; then
              node -e "
                const d = JSON.parse(require('fs').readFileSync('/tmp/edge.json','utf8'));
                const rows = d.pages || d.results || [];
                const bad = rows.filter(r => !r.ok).length;
                console.log('| edge-contract | ' + (rows.length - bad) + '/' + rows.length + ' rows |');
              " >> $GITHUB_STEP_SUMMARY || true
            fi
          } >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

  visual-gates-2:
    name: 'Visual gates (part 2: focus visibility, a11y sweep)'
    runs-on: ubuntu-latest
    # About 5 minutes; 15 leaves room for the full-set sweep on a slow runner.
    timeout-minutes: 15
    needs: build-site
    if: always() && needs.build-site.result == 'success'
    defaults:
      run:
        working-directory: apps/site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          # setup-node resolves this path from the repo root, NOT from
          # working-directory (same as the build-site job).
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: apps/site

      - name: Serve the build
        run: |
          echo "serving build $(cat .next/BUILD_ID)"
          npx next start -p 3422 > /tmp/next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3422/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up; log:"
          cat /tmp/next.log
          exit 1

      # Focus rings measured in pixels: every control's ring changes the page,
      # holds 3:1 against what it sits beside, and is not cut off by a
      # scroller; a refused (invalid) field still shows focus. The static
      # focus-ring gate proves a rule resolves; only pixels show a rule that
      # another rule overrides, a colour too faint, or a ring a parent clips.
      - name: Focus visibility
        run: node scripts/check-focus-visibility.js --base http://127.0.0.1:3422 --channel chrome

      # The incremental a11y sweep (handoff item #10): measure the routes the
      # commit touches — page.tsx -> its route, shared surfaces (globals.css,
      # layout, lib, next.config, public/) -> the full set, scripts-only
      # commits -> nothing. On a pull request the base is the merge base; on
      # push to main the base is the parent commit. An empty route list skips
      # the sweep (a scripts-only commit has no rendered surface).
      #
      # The checkout above is shallow (depth 1). On pull requests the base SHA
      # is not local, so fetch it; on push to main, HEAD~1 does not exist at
      # depth 1, so deepen to 2 before naming it. touched-routes.js then diffs
      # the two trees directly (no merge base — shallow clones cannot compute
      # one).
      - name: A11y sweep (touched routes)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --prune --depth=1 origin "+$BASE_SHA:refs/remotes/origin/base-sweep"
          else
            git fetch --no-tags --prune --depth=2 origin "${{ github.sha }}"
            BASE_SHA="HEAD~1"
          fi
          echo "sweep base: $BASE_SHA"
          ROUTES=$(node scripts/touched-routes.js --base-sha "$BASE_SHA")
          if [ -z "$ROUTES" ]; then
            echo "No rendered surface touched — sweep skipped"
            exit 0
          fi
          if [ "$ROUTES" = "FULL" ]; then
            echo "Shared surface touched — sweeping the full set"
            node scripts/a11y-sweep.js --base http://127.0.0.1:3422
          else
            echo "Sweeping: $ROUTES"
            node scripts/a11y-sweep.js --base http://127.0.0.1:3422 --routes "$ROUTES"
          fi

  visual-gates-3:
    name: 'Visual gates (part 3: dock clearance)'
    runs-on: ubuntu-latest
    # About 8 minutes. 35, because Dock clearance alone may spend two bounded
    # 960 s attempts (2 x 970 s with the kill grace, plus about 40 s of setup).
    # At 20 a hang took the whole job and a retry could never finish.
    timeout-minutes: 35
    needs: build-site
    if: always() && needs.build-site.result == 'success'
    defaults:
      run:
        working-directory: apps/site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          # setup-node resolves this path from the repo root, NOT from
          # working-directory (same as the build-site job).
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build
          path: apps/site

      - name: Serve the build
        run: |
          echo "serving build $(cat .next/BUILD_ID)"
          npx next start -p 3422 > /tmp/next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:3422/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up; log:"
          cat /tmp/next.log
          exit 1

      # A floating pill must never sit on what it floats over: the Studio pill
      # came up on a scroll up, mid-page, and hid a phone's score values. Each
      # route at 320, 390, 768 and 1440, dark and light, plus a mocked
      # stripe.com score result, walked down and back up.
      #
      # Normally 304-458 s (18 green runs, 2026-10-10). That evening three
      # part-3 runs sat in this step until the job's 20-minute limit with no
      # output. Each attempt is now bounded at 960 s, about twice the slowest
      # green run, and a timeout gets one retry; a real failure is never
      # retried, and a hang that repeats still fails. The script writes a
      # timestamped stderr line before and after each browser operation, and
      # when the bound signals it, it lists the operations still in flight,
      # longest last, so the last line names the route, width, theme and step
      # that hung. The step shell runs `bash -e`, so the exit code is captured
      # with `|| rc=$?`.
      - name: Dock clearance
        shell: bash
        run: |
          for attempt in 1 2; do
            rc=0
            timeout --kill-after=10s 960s node scripts/check-dock-clearance.js --base http://127.0.0.1:3422 --channel chrome || rc=$?
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ]; then exit "$rc"; fi
            echo "::warning::Dock clearance attempt $attempt timed out after 960 s"
          done
          echo "::error::Dock clearance timed out on both attempts"
          exit 1
