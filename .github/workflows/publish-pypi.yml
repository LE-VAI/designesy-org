name: Publish to PyPI

# Auto-publishes designesy-mcp to PyPI on every version tag, via GitHub OIDC
# trusted publishing. No stored secrets — uses the workflow's own OIDC token.
#
# Package source: packages/designesy-mcp/
# PyPI project: https://pypi.org/project/designesy-mcp/
#
# Prerequisite: PyPI trusted publishing must be configured at
#   https://pypi.org/manage/project/designesy-mcp/settings/publishing/
#   Publisher: GitHub, owner LE-VAI, repo designesy-org,
#   workflow publish-pypi.yml, environment pypi
#
# Sister workflow: publish-mcp-registry.yml (same v* tags, republishes
# server.json to registry.modelcontextprotocol.io via mcp-publisher OIDC).

on:
  push:
    # Full version tags only (v1.2.3). The Action's floating major tag `v1` also
    # matches "v*"; pushing it ran this workflow on 2026-08-16 and failed, and
    # the registry step would publish a version named "1" if it ever succeeded.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:        # allow manual re-publish from the Actions tab

permissions:
  id-token: write           # REQUIRED for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi        # PyPI trusted publishing environment
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Sync pyproject.toml version with the tag so builds always produce the
      # correct version. Previous failures (v1.9.0, v1.9.1) happened because
      # pyproject.toml was not bumped before tagging — PyPI rejected the
      # already-uploaded version with 400 Bad Request.
      # VERIFY, never sync. This step used to rewrite pyproject.toml from the tag
      # (added after v1.9.0/v1.9.1 were tagged without a bump). Syncing one file let
      # the other version surfaces drift: v1.12.2 shipped reporting 1.12.1 in its MCP
      # handshake (SERVER_VERSION). The package tests already require SERVER_VERSION,
      # the site constant, server.json and the Action's SARIF driver to equal
      # pyproject.toml, but nothing ran them before upload. Now a tag must point at a
      # commit where every surface is already bumped, and the tests gate the upload.
      - name: Verify the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          FILE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/designesy-mcp/pyproject.toml)
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag v$VERSION but pyproject.toml says $FILE_VERSION. Bump every version surface in a commit, then tag that commit."
            exit 1
          fi
          echo "Tag and pyproject.toml agree: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # A published version cannot be replaced, so the package's own tests (including
      # the four version-surface checks) must pass before anything is built or uploaded.
      - name: Run package tests
        run: |
          pip install pytest
          cd packages/designesy-mcp
          python -m pytest test -q

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel + sdist
        run: |
          cd packages/designesy-mcp
          python -m build

      - name: Publish to PyPI
        run: |
          cd packages/designesy-mcp
          twine upload --non-interactive dist/*.whl dist/*.tar.gz

      - name: Confirm publication
        run: |
          sleep 5
          VERSION=${GITHUB_REF#refs/tags/v}
          curl -s "https://pypi.org/pypi/designesy-mcp/$VERSION/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print('PyPI version:', d['info']['version'])" || echo "Version may take a few minutes to appear"