# Post-deploy smoke test — verifies production after Vercel deploys.
#
# Uses the event-driven `deployment_status` trigger (the 2026 Vercel-recommended
# pattern) instead of polling. When Vercel finishes a production deploy, it
# fires a `deployment_status: success` event in GitHub with `target_url`
# pointing at the live deployment. This workflow picks up that event and runs
# smoke tests against the live URL — zero polling, zero sleep commands.
#
# What this catches (within ~30 seconds of a production deploy):
#   • Homepage returns 200 with edge cache HIT
#   • /score returns 200 (dynamic page works)
#   • /pricing returns 200 with edge cache HIT (ISR working)
#   • /score?url=stripe.com returns 200 with OG image containing ?url= param
#   • Both production domains (www + apex) respond
#   • CSP headers are present
#
# This does NOT block the Vercel deploy (Vercel auto-deploys on git push).
# It runs in parallel and reports failures via GitHub notifications.
#
# Vercel KB reference:
# https://vercel.com/kb/guide/how-can-i-use-github-actions-with-vercel
# "GitHub Actions can trigger directly on deployment_status events. The
# target_url field hands you the unique preview URL, so the test runner
# always points at the deployment that just went live."

name: Post-deploy smoke test

on:
  # Event-driven: fires when Vercel reports a successful deployment.
  # This replaces polling with a clean event hook.
  deployment_status:
    types: [success]
  # Manual trigger for re-running smoke tests on demand.
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Only run for Production deployments (not Preview). For manual triggers,
    # always run.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')

    steps:
      - name: Determine target URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            # Vercel provides the live deployment URL in target_url
            TARGET="${{ github.event.deployment_status.target_url }}"
          else
            # Manual trigger — test production directly
            TARGET="https://www.designesy.org"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Testing: $TARGET"

      - name: Smoke test routes
        env:
          TARGET: ${{ steps.url.outputs.target }}
        run: |
          set -e
          echo "## Post-deploy smoke test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Target: $TARGET" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Helper: fetch a route and verify status + optional extra checks
          check_route() {
            local path="$1"
            local label="$2"
            local expect="${3:-200}"
            local extra_check="${4:-}"

            local headers
            headers=$(curl -sI "${TARGET}${path}" 2>/dev/null)
            local status=$(echo "$headers" | head -1 | grep -oE '[0-9]{3}')
            local cache=$(echo "$headers" | grep -i "x-vercel-cache" | tr -d '\r' | awk '{print $2}')

            if [ "$status" = "$expect" ]; then
              echo "✓ $label: $status ($cache)" >> $GITHUB_STEP_SUMMARY
              echo "✓ $label: $status ($cache)"
            else
              echo "✗ $label: expected $expect, got $status" >> $GITHUB_STEP_SUMMARY
              echo "✗ $label: expected $expect, got $status"
              exit 1
            fi

            # Extra pattern check (e.g. OG image contains ?url= param)
            if [ -n "$extra_check" ]; then
              local body
              body=$(curl -s "${TARGET}${path}" 2>/dev/null)
              if echo "$body" | grep -q "$extra_check"; then
                echo "  ✓ Extra check: $extra_check" >> $GITHUB_STEP_SUMMARY
              else
                echo "  ✗ Extra check failed: $extra_check" >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            fi
          }

          # Core routes
          check_route "/" "Homepage" "200"
          check_route "/score" "Score page" "200"
          check_route "/pricing" "Pricing (ISR)" "200"
          check_route "/DESIGN.md" "DESIGN.md root export" "200" "name: Designesy"

          # Dynamic OG image — verify ?url= param passes through to OG image
          check_route "/score?url=stripe.com" "Score with URL" "200" "opengraph-image?url=stripe.com"

          # ISR pages should hit edge cache (HIT or PRERENDER)
          PRICING_CACHE=$(curl -sI "${TARGET}/pricing" 2>/dev/null | grep -i "x-vercel-cache" | tr -d '\r' | awk '{print $2}')
          if [ "$PRICING_CACHE" = "HIT" ] || [ "$PRICING_CACHE" = "PRERENDER" ]; then
            echo "✓ Pricing ISR cache: $PRICING_CACHE" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ Pricing cache: $PRICING_CACHE (expected HIT/PRERENDER)" >> $GITHUB_STEP_SUMMARY
          fi

          # Both production domains respond
          WWW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://www.designesy.org" 2>/dev/null)
          APEX_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "https://designesy.org" 2>/dev/null)
          echo "✓ www.designesy.org: $WWW_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "✓ designesy.org (apex): $APEX_STATUS" >> $GITHUB_STEP_SUMMARY

          # CSP headers present
          CSP=$(curl -sI "${TARGET}" 2>/dev/null | grep -i "content-security-policy" | head -1)
          if [ -n "$CSP" ]; then
            echo "✓ CSP header present" >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ CSP header missing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All smoke tests passed" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "All smoke tests passed."

      - name: Report on failure
        if: failure()
        run: |
          echo "## ❌ Smoke test failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Target: ${{ steps.url.outputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the [Vercel dashboard](https://vercel.com/le-vais-projects/designesy-org) for deployment status." >> $GITHUB_STEP_SUMMARY

  # ── Job 2: Alias verification ──────────────────────────────────────────────
  # Verifies that www.designesy.org is actually serving the deployment that
  # Vercel just marked Ready.
  #
  # THIS JOB WAS DEAD, AND ITS DEATH WAS INVISIBLE (fixed 2026-09-25)
  # It previously looked for an `X-Mcp-Shim` response header on /api/mcp, as a
  # proxy for "the domain is serving recent code". `X-Mcp-Shim` no longer exists
  # anywhere in this repository — grep finds it ONLY in this file, in the very
  # check that looks for it. A compatibility shim was removed at some point and
  # the detector of that shim was left behind.
  #
  # Two consequences, both quiet:
  #   • The check could never pass again. It reported "⚠️ Alias may be stale" on
  #     EVERY deploy regardless of truth, so it produced a permanent false alarm.
  #   • It only warned. It never failed the workflow, so nothing ever acted on
  #     the warning. A check that always fires and never blocks is one nobody
  #     reads — which is why the real alias failures on 2026-09-25 went unnoticed.
  #
  # Worse, even when it worked it could only answer "is the domain newer than a
  # specific 2026-08-08 commit?" — a seven-week-wide window. It was structurally
  # incapable of detecting the actual failure mode, which is a domain exactly ONE
  # deployment behind.
  #
  # THE REPLACEMENT asserts the deployed commit directly. /api/version reports
  # VERCEL_GIT_COMMIT_SHA; the domain-serving-the-wrong-build answers with the
  # wrong SHA, and the comparison catches it at any distance. It FAILS the
  # workflow rather than warning, because the whole point is that a stale alias
  # must stop being something a human has to notice.
  alias-verify:
    name: Verify production alias
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: smoke-test
    if: always() && needs.smoke-test.result != 'skipped'

    steps:
      - name: Check if production domain is serving the latest deployment
        env:
          DEPLOY_TARGET: ${{ github.event.deployment_status.target_url || 'https://www.designesy.org' }}
          EXPECTED_SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          echo "## Alias verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment: $DEPLOY_TARGET" >> $GITHUB_STEP_SUMMARY
          echo "Expected commit: $EXPECTED_SHA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Give the alias a moment to propagate after the deploy settles.
          sleep 10

          DOMAIN="https://www.designesy.org"
          VERSION_JSON=$(curl -s --max-time 20 "${DOMAIN}/api/version" 2>/dev/null || echo '')
          # Extract the 40-hex commit. Matched with a strict pattern so a
          # malformed or absent field cannot be mistaken for a match.
          DOMAIN_SHA=$(printf '%s' "$VERSION_JSON" | grep -oE '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' || true)

          if [ -z "$DOMAIN_SHA" ]; then
            {
              echo "✗ **Could not measure domain freshness.**"
              echo ""
              echo "\`${DOMAIN}/api/version\` did not report a commit, so the alias"
              echo "cannot be verified. This is a FAILURE, not a skip: a freshness"
              echo "check that passes when it cannot see is the exact defect this"
              echo "job was rewritten to remove."
              echo ""
              echo "Likely causes:"
              echo ""
              echo "1. **System Environment Variables are disabled** in Vercel project"
              echo "   settings. Tick *Enable access to System Environment Variables* —"
              echo "   without it Vercel injects no \`VERCEL_GIT_COMMIT_SHA\`."
              echo "2. \`/api/version\` is not deployed yet — true only for the first"
              echo "   commit that introduced it."
              echo ""
              echo "Raw response (truncated): \`$(printf '%s' "$VERSION_JSON" | head -c 200)\`"
            } >> $GITHUB_STEP_SUMMARY
            echo "✗ Domain freshness: could not measure"
            exit 1
          fi

          if [ "$DOMAIN_SHA" = "$EXPECTED_SHA" ]; then
            echo "✅ Production alias is serving the expected commit: \`${DOMAIN_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "✅ Domain freshness verified: ${DOMAIN_SHA}"
          else
            {
              echo "✗ **STALE DOMAIN — the new deployment is not being served.**"
              echo ""
              echo "| | commit |"
              echo "|---|---|"
              echo "| just deployed (expected) | \`${EXPECTED_SHA}\` |"
              echo "| \`${DOMAIN}\` is serving | \`${DOMAIN_SHA}\` |"
              echo ""
              echo "The deployment is live and Ready; only the production alias has"
              echo "not moved. Vercel does this intermittently — it fired on every"
              echo "deploy on 2026-09-25."
              echo ""
              echo "**Fix (promote, not alias — promote keeps rollback bookkeeping"
              echo "coherent):**"
              echo ""
              echo '```bash'
              echo "npx vercel promote ${DEPLOY_TARGET} --yes"
              echo '```'
              echo ""
              echo "Then re-run this workflow."
            } >> $GITHUB_STEP_SUMMARY
            echo "✗ Domain freshness: STALE — expected ${EXPECTED_SHA}, domain serves ${DOMAIN_SHA}"
            exit 1
          fi

      - name: Report alias status
        if: always()
        run: |
          echo "Alias verification complete."

  # ── Rendered visual floor ─────────────────────────────────────────────────
  # The smoke job above is curl-based: status codes and headers only. It cannot
  # see the two defect classes that actually shipped on this site -- a 130-
  # character measure and ~380 sub-44px targets -- because both exist only in
  # the RENDERED page. Lint, types, tests and the prose gate all read source;
  # none of them could have caught either.
  #
  # Separate job rather than a step in the curl job: this one needs a real
  # browser, and the curl job deliberately has no checkout or npm install. Keeping
  # them apart means a browser install failure cannot mask the header checks.
  visual-floor:
    name: Visual floor (rendered)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')

    defaults:
      run:
        working-directory: apps/site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # @sparticuz/chromium ships a Linux Chromium, which is exactly what this
      # runner needs -- no `playwright install` step, no system packages. The
      # same binary is unusable on a Windows dev box, which is why the script
      # also has a --cdp mode for local runs.
      - name: Verify the browser binary resolves
        run: |
          node -e "
            const c = require('@sparticuz/chromium').default;
            c.setGraphicsMode = false;
            c.executablePath().then(p => console.log('chromium at', p));
          "

      # Measures the LIVE target, not the local build: the floors are about what
      # production actually serves, including anything the CDN or the alias is
      # doing to it.
      - name: Visual floor against production
        env:
          TARGET: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.target_url || 'https://www.designesy.org' }}
        run: |
          # TWO SHELL BUGS HAVE EATEN THIS STEP'S EVIDENCE. BOTH ARE FIXED HERE.
          #
          # 1. It used `node ... | tee -a $GITHUB_STEP_SUMMARY`. In a pipeline bash
          #    takes the LAST command's status, and tee succeeded — so a fatal
          #    browser error that exited the script 2 still reported the step as
          #    SUCCESS. A measurement that never ran read as a pass.
          #
          # 2. The fix for that captured to a file and catted it — but the runner
          #    invokes the shell with `bash -e`, so a non-zero `node` terminated
          #    the step IMMEDIATELY, before `status=$?` and before the cat. The job
          #    failed correctly and printed NOTHING: a real failure whose cause was
          #    invisible. Verified in the run logs: the step went straight from
          #    group-open to "Process completed with exit code 1" with no output.
          #
          # `|| status=$?` keeps the command from tripping `-e`, so the output is
          # always printed and the status is still propagated at the end.
          set +e
          echo "## Visual floor" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          status=0
          node scripts/visual-floor.js --base "$TARGET" > /tmp/floor.txt 2>&1 || status=$?
          cat /tmp/floor.txt
          cat /tmp/floor.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $status
