name: Rescore Leaderboard

# Re-score of the seed sites against the live designesy.org /api/score engine.
# Computes delta-since-last-run badges, pushes a branch with the updated
# seed.ts + snapshot.json and opens a landing issue. A person opens the PR and
# lands it after its full CI passes (v5, below); this workflow opens no PR and
# does not merge.
#
# v6 (decided 2026-10-23): the public leaderboard is withdrawn (CHANGELOG.md).
# The seed now holds designesy.org alone, and the Monday schedule is removed so no
# run republishes third-party scores. The workflow runs only when started by
# hand (workflow_dispatch), and then re-scores only the sites in the seed.
#
# History: prior to 2026-08-25 this workflow pushed directly to main. After
# main was locked down with branch protection (PR-only + required CI
# checks), the push was rejected and the weekly run failed three weeks in
# a row. v2 fixes by committing to a throwaway branch and opening a PR;
# the existing required-checks gate then auto-lands the data refresh.
#
# v3 (2026-10-08): v2 never landed a single refresh. Since GitHub's
# 2026-06-11 change, CI on a PR opened by github-actions[bot] waits for a
# write-access user to approve it, and the run expires unapproved. The wait
# step also read BRANCH from `env:`, where `$(date ...)` is never expanded, so
# it polled a branch that does not exist, timed out, and exited 0: every week
# read "success" while the PR sat stranded and the leaderboard went stale.
# v3 started CI itself with workflow_dispatch and waited to merge.
#
# v4 (2026-10-11): v3's premise did not hold. On PR #242 (2026-10-10) the
# dispatched run passed all five required checks by 09:05 and the PR stayed
# BLOCKED until 09:17, when the wait timed out: the pull_request run waiting
# for approval kept it blocked, and only re-running that run by hand (09:22)
# made it mergeable. On PR #273 (2026-10-11) the held run was re-run by hand
# while this workflow was still waiting, and the wait then merged on UNSTABLE,
# before the three non-required "Visual gates" jobs had finished; a merge made
# with GITHUB_TOKEN also starts no push CI on main. So this workflow no longer
# starts CI or merges. It re-scores, opens the PR and stops. A maintainer
# starts the held CI runs, checks the data, and
# merges only when every check, the visual gates included, has passed and
# GitHub reports CLEAN.
#
# v5 (2026-10-21): since 2026-10-15 the repository does not let Actions
# create or approve pull requests, on purpose. The 2026-10-19 run re-scored
# every site and pushed its branch, then `gh pr create` failed with "GitHub
# Actions is not permitted to create or approve pull requests", so no PR
# existed and the site kept the 2026-10-12 data. This workflow now pushes the
# branch and opens a landing issue,
# assigned to the maintainer, with a link that opens the PR and the exact
# command to open it. A person opens the PR, so its CI runs without the
# approval step bot-opened PRs needed. A newer run's issue closes an older
# unlanded one, whose data it replaces.
# The setting stays off, and no personal or App token takes its place: a token
# that can push this branch and open its pull request could also merge it.
#
# This workflow is the only write path for the seed. It runs the re-score,
# generates the updated TypeScript, commits to a branch, and opens the landing
# issue for its PR. (The Vercel Cron that warmed the score cache before each
# Monday run is removed with the schedule, v6 above.)
#
# No schedule: manual dispatch only (v6, above).

on:
  workflow_dispatch:         # manual trigger from the Actions tab
    inputs:
      expect_engine_version:
        description: 'Stop before writing anything unless the live engine reports this version (for the re-score right after a release, e.g. 1.2.0). Leave empty otherwise.'
        required: false
        default: ''

# Nothing by default; the one job below asks for what it uses.
permissions: {}

jobs:
  rescore:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push the leaderboard branch
      issues: write            # needed to open the landing issue and its labels
    # Re-scoring the 30-site seed took ~7 min; the one-site seed takes far less.
    # The run no longer waits for CI (v4), so 20 minutes leaves room for slow
    # fetches.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0      # full history so the date command works
          # The re-score runs code over pages fetched from the seed's sites, so
          # the write token is not left in .git/config for it. Only the push
          # step below authenticates.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Re-score all leaderboard sites
        env:
          SCORE_API: 'https://www.designesy.org/api/score'
          # Empty unless set when dispatched after a release.
          EXPECT_ENGINE_VERSION: ${{ github.event.inputs.expect_engine_version }}
        run: node scripts/rescore-leaderboard.mjs

      - name: Detect changes
        id: changes
        run: |
          # Every file the script writes. self-report.json and batch-data.ts were
          # written each week but never committed, so /docs' receipt and the data
          # pages' category breakdowns went stale while the composites moved.
          if git diff --quiet apps/site/app/leaderboard/seed.ts apps/site/app/leaderboard/snapshot.json apps/site/app/leaderboard/batch-data.ts apps/site/app/docs/self-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No score changes since the last run — skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch and open the landing issue (only if leaderboard changed)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The checkout kept no credential (above); git authenticates through gh.
          gh auth setup-git
          DATE_STAMP=$(date -u +%Y-%m-%d)
          BRANCH="leaderboard/weekly-${DATE_STAMP}"
          # A second run on the same UTC day (two dispatches, or, before v6, a
          # dispatch and then the Monday cron) found the first run's merged branch still on the
          # remote: the push was rejected as non-fast-forward after the
          # scoring had finished, and that week's data was lost (2026-10-12).
          # Keep the plain name when it is free; otherwise add the run id.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            BRANCH="${BRANCH}-${GITHUB_RUN_ID}"
          fi
          git config user.name 'LE-VAI'
          git config user.email '281449961+LE-VAI@users.noreply.github.com'
          git checkout -b "${BRANCH}"
          git add apps/site/app/leaderboard/seed.ts apps/site/app/leaderboard/snapshot.json apps/site/app/leaderboard/batch-data.ts apps/site/app/docs/self-report.json
          git commit -m "chore(leaderboard): re-score ${DATE_STAMP}

          Re-score of the seed sites against the live /api/score engine,
          started by hand. Delta badges computed from the previous run's
          snapshot. Triggered by .github/workflows/rescore-leaderboard.yml."
          git push -u origin "${BRANCH}"

          # Labels must exist before they can be attached — the 2026-08-30 run
          # failed with "could not add label: 'leaderboard' not found" AFTER
          # pushing the branch, leaving scored data stranded. Creating them
          # here is idempotent (|| true on the already-exists case).
          gh label create leaderboard --description "Leaderboard data refresh" --color 0E8A16 || true
          gh label create automated --description "Automated workflow output" --color D4C5F9 || true

          # Actions may not open the PR (v5, above), so a person does. The
          # issue carries what they need. The PR body closes the issue on
          # merge, so the issue's number goes in after it exists.
          TITLE="chore(leaderboard): re-score ${DATE_STAMP}"
          SERVER_REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          ISSUE_URL=$(gh issue create \
            --title "Leaderboard re-score ${DATE_STAMP} is ready to land" \
            --body "Writing the landing steps." \
            --label "leaderboard,automated" \
            --assignee LE-VAI)
          ISSUE="${ISSUE_URL##*/}"
          PR_BODY="Re-score of the seed from ${SERVER_REPO}/actions/runs/${GITHUB_RUN_ID}. Updates seed.ts, snapshot.json, the per-category batch-data.ts and the /docs self-report.json from the live /api/score engine. Closes #${ISSUE}."
          {
            echo "The re-score finished and pushed \`${BRANCH}\` (run: ${SERVER_REPO}/actions/runs/${GITHUB_RUN_ID})."
            echo "Actions may not open pull requests in this repository, so the PR is opened by hand. Until it merges, the site keeps the previous run's data."
            echo ""
            echo "**Open the PR**: ${SERVER_REPO}/compare/main...${BRANCH}?expand=1, or:"
            echo ""
            echo '```sh'
            echo "gh pr create --repo ${GITHUB_REPOSITORY} --base main --head ${BRANCH} --title \"${TITLE}\" --body \"${PR_BODY}\" --label leaderboard --label automated"
            echo '```'
            echo ""
            echo "**Land it**: check the data (small score deltas, prevScore and scoredAt on each row), bring the branch up to date with main, and merge only when every check, the Visual gates parts included, has passed. A person opened the PR, so its CI runs without an approval step."
          } > "${RUNNER_TEMP}/landing-issue.md"
          gh issue edit "${ISSUE}" --body-file "${RUNNER_TEMP}/landing-issue.md"

          # An older landing issue still open means that run never landed.
          # This branch carries newer data, so the older one is closed.
          for OLD in $(gh issue list --state open --label leaderboard --json number,title \
              --jq ".[] | select(.title | endswith(\"is ready to land\")) | select(.number != ${ISSUE}) | .number"); do
            gh issue close "${OLD}" --comment "Superseded by #${ISSUE}: its branch carries newer data."
          done

          echo "Pushed \`${BRANCH}\` and opened ${ISSUE_URL} to land it." | tee -a "$GITHUB_STEP_SUMMARY"
