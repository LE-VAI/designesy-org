name: Rescore Leaderboard

# Weekly re-score of all leaderboard seed sites against the live designesy.org
# /api/score engine. Computes delta-since-last-week badges and opens a PR
# against main with the updated seed.ts + snapshot.json. The PR then runs
# the protected-branch CI gate (Build site + Build & test MCP package) and
# is auto-merged once those checks pass — this keeps leaderboard data fresh
# without manual batch runs.
#
# History: prior to 2026-08-25 this workflow pushed directly to main. After
# main was locked down with branch protection (PR-only + required CI
# checks), the push was rejected and the weekly run failed three weeks in
# a row. v2 fixes by committing to a throwaway branch and opening a PR;
# the existing required-checks gate then auto-lands the data refresh.
#
# v3 (2026-10-08): v2 never landed a single refresh. Since GitHub's
# 2026-06-11 change, CI on a PR opened by github-actions[bot] waits for a
# write-access user to approve it, and the run expires unapproved. The wait
# step also read BRANCH from `env:`, where `$(date ...)` is never expanded, so
# it polled a branch that does not exist, timed out, and exited 0: every week
# read "success" while the PR sat stranded and the leaderboard went stale.
# v3 starts CI itself with workflow_dispatch (which always runs, and whose
# checks land on the PR's head commit), merges only when branch protection
# reports CLEAN, and fails the run on a failed check, a stale branch or a
# timeout. leaderboard-freshness.yml independently alarms if the public data
# is more than 8 days old, whatever the cause.
#
# The Vercel Cron (/api/cron/rescore) also fires weekly but only returns
# scores as a JSON response — it can't write to the repo. This workflow IS
# the write path. It runs the re-score, generates the updated TypeScript,
# commits to a branch, and opens a PR.
#
# Schedule: Mondays 10:00 UTC (one hour after the Vercel Cron fires, so the
# Vercel /api/score cache is warm from the cron's probe — the Action's fetches
# are instant instead of 3-8s cold).

on:
  schedule:
    - cron: '0 10 * * 1'   # every Monday 10:00 UTC
  workflow_dispatch:         # manual trigger from the Actions tab

permissions:
  contents: write            # needed to push the leaderboard branch
  pull-requests: write       # needed to open the auto-PR
  actions: write            # needed to start CI on the PR branch (workflow_dispatch)

jobs:
  rescore:
    runs-on: ubuntu-latest
    # Re-scoring 30 sites against the live engine takes ~7 min, and the wait
    # for CI allows 20 more -- 15 min timed out mid-wait on the first 42-check
    # run (2026-08-31), stranding an auto-mergeable PR.
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0      # full history so the date command works

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Re-score all leaderboard sites
        env:
          SCORE_API: 'https://www.designesy.org/api/score'
        run: node scripts/rescore-leaderboard.mjs

      - name: Detect changes
        id: changes
        run: |
          # Every file the script writes. self-report.json and batch-data.ts were
          # written each week but never committed, so /docs' receipt and the data
          # pages' category breakdowns went stale while the composites moved.
          if git diff --quiet apps/site/app/leaderboard/seed.ts apps/site/app/leaderboard/snapshot.json apps/site/app/leaderboard/batch-data.ts apps/site/app/docs/self-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No score changes since last week — skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR (only if leaderboard changed)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_STAMP=$(date -u +%Y-%m-%d)
          BRANCH="leaderboard/weekly-${DATE_STAMP}"
          git config user.name 'LE-VAI'
          git config user.email '281449961+LE-VAI@users.noreply.github.com'
          git checkout -b "${BRANCH}"
          git add apps/site/app/leaderboard/seed.ts apps/site/app/leaderboard/snapshot.json apps/site/app/leaderboard/batch-data.ts apps/site/app/docs/self-report.json
          git commit -m "chore(leaderboard): weekly re-score ${DATE_STAMP}

          Automated re-score of all leaderboard seed sites against the live
          /api/score engine. Delta badges computed from the previous week's
          snapshot. Triggered by .github/workflows/rescore-leaderboard.yml."
          git push -u origin "${BRANCH}"
          # Later steps read the branch from here. A value under `env:` is a
          # literal: `$(date ...)` there is never run.
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

          # Labels must exist before gh pr create can attach them — the
          # 2026-08-30 run failed with "could not add label: 'leaderboard'
          # not found" AFTER pushing the branch, leaving scored data stranded
          # with no PR. Creating them here is idempotent (|| true on the
          # already-exists case).
          gh label create leaderboard --description "Leaderboard data refresh" --color 0E8A16 || true
          gh label create automated --description "Automated workflow output" --color D4C5F9 || true

          # Open a PR. The branch protection rules on main require
          # CI / Build site + CI / Build & test MCP package to pass; both
          # are quick and will gate the auto-merge below.
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(leaderboard): weekly re-score ${DATE_STAMP}" \
            --body "Automated weekly re-score of the leaderboard cohort. Updates seed.ts, snapshot.json, the per-category batch-data.ts and the /docs self-report.json from the live /api/score engine. Diff is expected to be small score deltas + the prevScore field on each row.

          No code review needed — this is the canonical write path for the public leaderboard (was failing weekly for 3 weeks before the PR-flow fix). CI gate: CI / Build site + CI / Build & test MCP package." \
            --label "leaderboard,automated" \
            --assignee LE-VAI

      - name: Start CI on the PR branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The pull_request run GitHub opened for this PR waits for an approval
          # no one gives. A workflow_dispatch started with GITHUB_TOKEN always
          # runs, and its check runs land on the same head commit, which is what
          # branch protection reads. Chosen by the repo owner, 2026-10-08.
          gh workflow run ci.yml --ref "${BRANCH}"

      - name: Wait for required checks, then merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Every way this can end without a merge fails the run, so a stranded
          # PR shows red. The old loop exited 0 on all of them.
          for i in $(seq 1 40); do
            sleep 30
            STATE=$(gh pr view "${BRANCH}" --json mergeStateStatus --jq '.mergeStateStatus') || STATE=UNKNOWN
            FAILED=$(gh pr checks "${BRANCH}" --required --json bucket               --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' 2>/dev/null) || true
            FAILED=${FAILED:-0}
            echo "Attempt $i: merge state ${STATE}, ${FAILED} required check(s) failed"
            if [ "${FAILED}" != "0" ]; then
              echo "::error::A required check failed on ${BRANCH}; the PR is left open for review."
              exit 1
            fi
            case "${STATE}" in
              CLEAN|HAS_HOOKS|UNSTABLE)
                # Branch protection is satisfied; gh refuses the merge otherwise.
                gh pr merge "${BRANCH}" --squash --delete-branch
                echo "Merged ${BRANCH}."
                exit 0
                ;;
              BEHIND|DIRTY)
                echo "::error::${BRANCH} is ${STATE} against main. Re-run this workflow to re-score from the current main."
                exit 1
                ;;
            esac
          done
          echo "::error::Required checks did not finish within 20 minutes; ${BRANCH} is left open."
          exit 1
